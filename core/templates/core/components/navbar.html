<nav class="space-x-6 flex items-center">
    <a href="{% url 'home' %}" class="text-gray-700 font-semibold hover:text-orange-500">Home</a>
    <a href="{% url 'menu' %}" class="text-gray-700 font-semibold hover:text-orange-500">Menu</a>
    <a href="{% url 'track' %}" class="text-gray-700 font-semibold hover:text-orange-500">Tracking</a>
    <a href="{% url 'reservation' %}" class="text-gray-700 font-semibold hover:text-orange-500">Reservation</a>
    <a href="{% url 'contact' %}" class="text-gray-700 font-semibold hover:text-orange-500">Contact</a>

    {% if user.is_authenticated %}
    <div class="flex items-center space-x-4 ml-6 border-l pl-6 border-gray-200">
        <span class="text-gray-600 text-sm italic">Hello, {{ user.username }}</span>
        <a href="{% url 'logout' %}"
            class="bg-orange-500 text-white px-4 py-2 rounded-lg font-semibold hover:bg-orange-600 transition">Logout</a>
    </div>
    {% else %}
    <div class="flex items-center space-x-4 ml-6 border-l pl-6 border-gray-200">
        <a href="{% url 'login' %}" class="text-gray-700 font-semibold hover:text-orange-500">Login</a>
        <a href="{% url 'register' %}"
            class="bg-orange-500 text-white px-4 py-2 rounded-lg font-semibold hover:bg-orange-600 transition">Sign
            Up</a>
    </div>
    {% endif %}
</nav>
